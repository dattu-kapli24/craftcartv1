<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — OrderSpot</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin.css">
  <!-- Lucide Icons for professional look -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="admin-body">
  <header class="header">
    <div class="header__inner">
      <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Toggle Menu">
        <i data-lucide="menu"></i>
      </button>
      <div class="brand">
        <div class="brand__logo" id="brandLogo">A</div>
        <div class="brand__text">
          <h1 class="brand__name">Admin Dashboard</h1>
          <p class="brand__tagline">Manage your store configuration</p>
        </div>
      </div>
      <div style="display: flex; gap: 12px; align-items: center;">
        <a href="/" class="cart-btn" id="viewStoreLink" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 8px; width: auto; padding: 0 16px;" hidden>
          <span>View Store</span>
        </a>
      </div>
    </div>
  </header>

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-header">
        <h3>My Stores</h3>
        <button id="sidebarCreateBtn" class="add-btn" title="Create New Store">+</button>
      </div>
      <nav id="sidebarStoreList" class="sidebar-nav">
        <!-- Stores will be listed here -->
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="admin-main-content">
      <!-- Empty State -->
      <div id="welcomeState" class="admin-section welcome-card">
        <h2>Welcome to OrderSpot</h2>
        <p>Select a store from the sidebar or create a new one to get started.</p>
        <button type="button" id="mainCreateBtn" class="btn-whatsapp" style="max-width: 250px; margin: 20px auto;">+ Create New Store</button>
      </div>

      <!-- Editor Form -->
      <form id="adminForm" class="admin-form" hidden>
        <!-- Store Identity -->
        <section class="admin-section">
          <h2>Store Identity</h2>
          <div class="form-group">
            <label for="name">Store Name</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="form-group">
            <label for="tagline">Tagline</label>
            <input type="text" id="tagline" name="tagline">
          </div>
          <div class="form-group">
            <label for="whatsappNumber">WhatsApp Number (Digits only)</label>
            <input type="text" id="whatsappNumber" name="whatsappNumber" required>
          </div>
          <div class="form-group">
            <label for="currencySymbol">Currency Symbol</label>
            <input type="text" id="currencySymbol" name="currencySymbol" required>
          </div>
          <div class="form-group">
            <label for="storeType">Store Type</label>
            <select id="storeType" name="storeType" class="form-control" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg);">
              <option value="B2C">B2C Retail (Standard)</option>
              <option value="B2B">B2B Wholesale (Bulk Tiers/MOQs)</option>
            </select>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="accentColor">Accent Color</label>
              <input type="color" id="accentColor" name="accentColor">
            </div>
            <div class="form-group">
              <label for="accentColorDark">Accent Color Dark</label>
              <input type="color" id="accentColorDark" name="accentColorDark">
            </div>
          </div>
        </section>

        <!-- Categories -->
        <section class="admin-section">
          <h2>Categories</h2>
          <div id="categoriesList" class="tags-input">
            <!-- Categories will be rendered here -->
          </div>
          <div class="form-row" style="margin-top: 10px;">
            <input type="text" id="newCategory" placeholder="New category name">
            <button type="button" id="addCategoryBtn" class="btn-secondary">Add</button>
          </div>
        </section>

        <!-- Products -->
        <section class="admin-section">
          <h2>Products Catalog</h2>
          <div id="productsList" class="admin-products-grid">
            <!-- Products will be rendered here -->
          </div>
          <button type="button" id="addProductBtn" class="btn-secondary" style="margin-top: 20px; width: 100%;">+ Add New Product</button>
        </section>

        <div class="admin-actions" style="flex-direction: column; gap: 10px;">
          <button type="submit" class="btn-whatsapp">Save All Changes to Cloud</button>

          <div style="display: flex; flex-direction: column; gap: 10px; width: 100%;">
            <button type="button" id="syncAllBlueprintsBtn" class="btn-secondary" style="background: #ecfdf5; color: #059669; border-color: #a7f3d0; font-weight: 700; font-size: 0.85rem; padding: 10px;">🔄 Sync All Product Images & Catalogs to Database</button>
            <button type="button" id="importBtn" class="btn-secondary" style="background: #f1f5f9;">Import (CSV/JSON)</button>
            <button type="button" id="migrateBtn" class="btn-secondary" style="background: #e2e8f0; font-size: 0.8rem;">Apply Template to Current</button>
            <button type="button" id="repairAllBtn" class="btn-secondary" style="background: #fee2e2; color: #ef4444; border-color: #fecaca; font-size: 0.75rem;">Repair & Restore All Stores</button>
          </div>
          <input type="file" id="importFile" accept=".csv,.json" hidden>
        </div>
      </form>
    </main>
  </div>

  <!-- Toast for feedback -->
  <div id="toast" class="toast" hidden></div>

  <script src="/store-config.js"></script>
  <script type="module" src="/admin.js"></script>
</body>
</html>
