<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — OrderSpot Admin</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="admin-body">
  <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;">
    <div class="admin-section" style="max-width: 400px; width: 100%;">
      <div class="brand" style="justify-content: center; margin-bottom: 24px;">
        <div class="brand__logo">A</div>
        <h1 class="brand__name" style="font-size: 1.5rem;">OrderSpot Login</h1>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px;">
        </div>
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
            <label for="password" style="margin-bottom: 0;">Password</label>
            <button type="button" id="forgotPassBtn" style="background: none; border: none; color: #0284c7; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-decoration: underline;">Forgot Password?</button>
          </div>
          <input type="password" id="password" required style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px;">
        </div>
        <button type="submit" id="submitBtn" class="btn-whatsapp" style="margin-top: 10px;">Sign In to Admin</button>
        <p id="errorMsg" style="color: #ef4444; font-size: 0.85rem; margin-top: 12px; text-align: center;" hidden></p>
        <p id="successMsg" style="color: #10b981; font-size: 0.85rem; margin-top: 12px; text-align: center;" hidden></p>
      </form>

      <!-- Password Reset Form (Hidden by default) -->
      <form id="resetForm" style="display: none;">
        <div style="margin-bottom: 16px;">
          <h3 style="font-size: 1.1rem; font-weight: 700; color: #1e293b; margin-bottom: 6px;">Reset Password</h3>
          <p style="font-size: 0.85rem; color: #64748b; line-height: 1.4;">Enter your registered account email and we'll send you a password reset link.</p>
        </div>
        <div class="form-group">
          <label for="resetEmail">Email Address</label>
          <input type="email" id="resetEmail" required style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px;">
        </div>
        <button type="submit" id="resetSubmitBtn" class="btn-whatsapp" style="margin-top: 10px; background: #0284c7;">Send Reset Email</button>
        <button type="button" id="backToLoginBtn" style="width: 100%; margin-top: 10px; background: none; border: 1px solid #cbd5e1; padding: 10px; border-radius: 8px; font-weight: 600; color: #475569; cursor: pointer;">← Back to Sign In</button>
        <p id="resetMsg" style="font-size: 0.85rem; margin-top: 12px; text-align: center;" hidden></p>
      </form>
    </div>
  </div>

  <script type="module" src="/login.js"></script>
</body>
</html>
