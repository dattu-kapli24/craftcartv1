<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#0f766e" />
  <title>CraftCart</title>
  <link rel="preconnect" href="https://images.pexels.com" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%8D%EF%B8%8F%3C/text%3E%3C/svg%3E" />
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="header" id="header">
    <div class="header__inner">
      <div class="brand">
        <div class="brand__logo" id="brandLogo">S</div>
        <div class="brand__text">
          <h1 class="brand__name" id="storeName">Store Name</h1>
          <p class="brand__tagline" id="storeTagline">Tagline</p>
        </div>
      </div>

      <div class="header__search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="search" id="searchInput" placeholder="Search products…" aria-label="Search products" autocomplete="off" />
      </div>

      <button class="cart-btn" id="cartBtn" aria-label="Open cart">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6h15l-1.5 9h-12L5 3H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="9" cy="20" r="1.6" fill="currentColor"/>
          <circle cx="18" cy="20" r="1.6" fill="currentColor"/>
        </svg>
        <span class="cart-btn__count" id="cartCount" hidden>0</span>
      </button>
    </div>
  </header>

  <!-- ===== Category Pills ===== -->
  <nav class="pills" id="categoryPills" aria-label="Product categories"></nav>

  <!-- ===== Main / Product Grid ===== -->
  <main class="main">
    <div class="main__head">
      <h2 class="main__title" id="gridTitle">All Products</h2>
      <span class="main__count" id="gridCount"></span>
    </div>
    <div class="grid" id="productGrid" aria-live="polite"></div>
    <p class="empty-state" id="emptyState" hidden>No products match your search.</p>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <p id="footerName">Store Name</p>
    <p class="footer__sub">Order via WhatsApp · Cash on delivery available</p>
  </footer>

  <!-- ===== Cart Slide-over ===== -->
  <div class="overlay" id="overlay" hidden></div>
  <aside class="cart" id="cartPanel" aria-label="Your cart" aria-hidden="true">
    <div class="cart__head">
      <h2>Your Cart</h2>
      <button class="cart__close" id="cartClose" aria-label="Close cart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="cart__body" id="cartItems"></div>

    <div class="cart__foot" id="cartFoot">
      <div class="cart__total">
        <span>Total</span>
        <span id="cartTotal">₹0</span>
      </div>

      <form id="checkoutForm" class="checkout-form" novalidate>
        <input type="text" id="custName" placeholder="Your Name *" required autocomplete="name" />
        <input type="tel" id="custPhone" placeholder="Phone Number *" required autocomplete="tel" />
        <textarea id="custAddress" placeholder="Delivery Address *" rows="2" required></textarea>
        <input type="text" id="custPin" placeholder="Pincode / City *" required autocomplete="postal-code" />
        <textarea id="custNotes" placeholder="Notes for the artist (any custom colours, dates or gift message)" rows="2"></textarea>
        <button type="submit" class="btn-whatsapp" id="placeOrderBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 00-8.6 15l-1.4 5 5.1-1.3A10 10 0 1012 2zm0 18a8 8 0 01-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1112 20zm4.4-6c-.2-.1-1.4-.7-1.6-.8s-.4-.1-.5.1-.6.8-.8 1-.3.2-.5.1a6.5 6.5 0 01-1.9-1.2 7.2 7.2 0 01-1.3-1.7c-.1-.2 0-.4.1-.5l.4-.4.2-.4v-.4l-.8-1.9c-.2-.5-.4-.4-.5-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2 5.2 5.2 0 001.1 2.7 11.8 11.8 0 004.5 4 5.3 5.3 0 002.4.5 2.6 2.6 0 001.7-1.2 2.1 2.1 0 00.2-1.2c-.1-.1-.3-.2-.5-.3z" fill="currentColor"/></svg>
          Place Order via WhatsApp
        </button>
      </form>
    </div>
  </aside>

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="store-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
