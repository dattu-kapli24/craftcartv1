<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home Page Migration Tool — OrderSpot</title>
  <style>
    body { font-family: sans-serif; padding: 40px; line-height: 1.6; max-width: 600px; margin: 0 auto; background: #f4f7f6; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h1 { color: #2c3e50; margin-top: 0; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 14px; background: #27ae60; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #bdc3c7; }
    #status { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Home Page Migration</h1>
    <p>This tool will only update the <strong>Home Page (Marketplace)</strong> with premium photos. It will <strong>NOT</strong> touch BakersCart or ResinArt.</p>

    <input type="email" id="email" placeholder="Admin Email">
    <input type="password" id="password" placeholder="Admin Password">
    <button id="migrateBtn">Log In & Update Home Page</button>

    <div id="status"></div>
  </div>

  <script type="module">
    import { loginAdmin, saveStoreConfig } from "./firebase-service.js";

    // Premium Template Data for Home (Marketplace View)
    const fullTemplate = {
      store: {
        name: "OrderSpot Marketplace",
        whatsappNumber: "918722661098",
        currencySymbol: "₹",
        accentColor: "#0f766e",
        accentColorDark: "#0d9488",
        tagline: "Curated collection from local vendors"
      },
      categories: ["All", "Resin Art", "Bakers", "Crochet", "Gifting"],
      products: [
        // Resin Art
        { id: "resin-frame-8", name: "Premium 8 Inch Resin Frame", price: 2600, category: "Resin Art", image: "https://images.unsplash.com/photo-1635532545300-84c483d35272?w=800", inStock: true, description: "Elegant resin artwork with preserved flowers." },
        { id: "rose-pendant-combo", name: "Artisan Rose Pendant", price: 1450, category: "Resin Art", image: "https://images.unsplash.com/photo-1616541823729-00fe0aacd32c?w=800", inStock: true, description: "Delicate resin pendant with real rose petals." },

        // Bakers
        { id: "luxury-truffle-cake", name: "Belgian Chocolate Truffle", price: 1250, category: "Bakers", image: "https://images.unsplash.com/photo-1578985543662-477dac423cf9?w=800", inStock: true, description: "Decadent dark chocolate truffle cake for celebrations." },
        { id: "berry-vanilla-cake", name: "Fresh Berry Vanilla Cake", price: 950, category: "Bakers", image: "https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?w=800", inStock: true, description: "Light sponge cake topped with farm-fresh berries." },

        // Crochet
        { id: "hand-stitched-bunny", name: "Hand-Stitched Bunny Toy", price: 850, category: "Crochet", image: "https://images.unsplash.com/photo-1584992236310-6edddc08acff?w=800", inStock: true, description: "Soft, cuddly amigurumi bunny made with organic yarn." },
        { id: "boho-crochet-tote", name: "Boho Style Crochet Tote", price: 1500, category: "Crochet", image: "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=800", inStock: true, description: "Stylish and sturdy handmade cotton tote bag." },

        // Gifting
        { id: "luxury-hamper-box", name: "Curated Celebration Box", price: 3500, category: "Gifting", image: "https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=800", inStock: true, description: "A premium assortment of gourmet treats and candles." },
        { id: "wellness-spa-basket", name: "Relax & Unwind Spa Set", price: 2200, category: "Gifting", image: "https://images.unsplash.com/photo-1544175089-6014404972ab?w=800", inStock: true, description: "Handpicked selection of essential oils and handmade soaps." }
      ]
    };

    const btn = document.getElementById('migrateBtn');
    const status = document.getElementById('status');

    btn.onclick = async () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;

      btn.disabled = true;
      status.style.display = 'block';
      status.className = '';
      status.textContent = 'Authenticating...';

      const auth = await loginAdmin(email, pass);
      if (!auth.success) {
        status.className = 'error';
        status.textContent = 'Login failed: ' + auth.error;
        btn.disabled = false;
        return;
      }

      try {
        status.textContent = 'Updating Home Page (demo)...';
        await saveStoreConfig("demo", fullTemplate);

        status.className = 'success';
        status.innerHTML = '<strong>Success!</strong> Home page updated with premium photos.<br><br>' +
                           'Visit: <a href="/" target="_blank">orderspot.in</a>';
      } catch (e) {
        status.className = 'error';
        status.textContent = 'Update error: ' + e.message;
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
